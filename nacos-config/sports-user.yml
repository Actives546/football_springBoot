# ============================================
# Nacos 用户服务配置文件：sports-user.yml
# 用户微服务（sports-user）专属配置
# ============================================

# 服务端口
server:
  port: 8081

# Spring 配置
spring:
  application:
    name: sports-user
  
  # Spring Boot 2.7+ 与 Springfox 3.0.0 兼容性配置
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# Knife4j Swagger 配置
knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    title: 用户服务接口文档
    description: 数字化体育赋能平台 - 用户微服务接口文档
    version: 1.0.0

# 用户服务特有日志级别（覆盖公共配置）
logging:
  level:
    com.sports.user: debug
    com.sports.common: debug
