server:
  port: 8082

spring:
  application:
    name: sports-auth
  config:
    import: "optional:nacos:common-config.yml,optional:nacos:sports-auth.yml"
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  redis:
    host: 127.0.0.1
    port: 6379
    password: 123456
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.31.32:8848
        username: nacos
        password: nacos
        namespace: public
        group: DEFAULT_GROUP
        weight: 1
      config:
        server-addr: 192.168.31.32:8848
        username: nacos
        password: nacos
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yml

jwt:
  secret: sports-cloud-jwt-default-secret-key-2024-very-long-and-secure-key-for-hs256
  expiration: 86400000
  header: Authorization
  prefix: Bearer

knife4j:
  enable: true
  setting:
    language: zh_cn
