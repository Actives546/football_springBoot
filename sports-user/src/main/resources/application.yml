server:
  port: 8081

spring:
  application:
    name: sports-user
  # 导入 Nacos 配置：先导入公共配置，再导入服务专属配置（后者覆盖前者）
  config:
    import: "optional:nacos:common-config.yml,optional:nacos:sports-user.yml"
  # Spring Boot 2.7+ 与 Springfox 3.0.0 兼容性配置
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.31.32:8848
        username: nacos
        password: nacos
        namespace: public
        group: DEFAULT_GROUP
        weight: 1
      config:
        server-addr: 192.168.31.32:8848
        username: nacos
        password: nacos
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yml

# Knife4j Swagger 配置
knife4j:
  enable: true
  setting:
    language: zh_cn