server:
  port: 8080  # 网关服务端口

spring:
  application:
    name: sports-gateway  # 服务名称，用于Nacos注册
  cloud:
    nacos:
      # Nacos 注册中心配置
      discovery:
        server-addr: 127.0.0.1:8848  # Nacos服务地址
        namespace: public  # 命名空间
        group: DEFAULT_GROUP  # 分组
      # Nacos 配置中心配置
      config:
        server-addr: 127.0.0.1:8848  # Nacos服务地址
        namespace: public  # 命名空间
        group: DEFAULT_GROUP  # 分组
        file-extension: yml  # 配置文件格式
        shared-configs:
          - data-id: common-config.yml
            group: DEFAULT_GROUP
            refresh: true
